<script th:inline="javascript">
	function home() {
		location.href = 'Dashboard'
	}
	
	function Success() {
		location.href = 'DeleteReport'
	}
	function back() {
		window.history.back();
	}
	function view() {
		location.href = 'Follow_up?formmode=view';
	}
</script>
<script>
function SubmitReport() {
    const curr = document.getElementById("Cur").value;
    const reconDate = document.getElementById("RECONDate").value;
    const type = 'DEBIT';

    // Convert YYYY-MM-DD → DD-MM-YYYY
    const [year, month, day] = reconDate.split("-");
    const formattedDate = `${day}-${month}-${year}`;

    const Url = 'deleteReconDate' +
        '?type=' + encodeURIComponent(curr) +
        '&curr=' + encodeURIComponent(type) +
        '&recon_date=' + encodeURIComponent(formattedDate);
        if(curr === '' || reconDate ===''){
        	$.toast({ heading: 'Warning',
        		text: 'All mandatory fields must be filled.',
        		icon: 'warning',
        		position: { 
        			left: 1600,
        			top: 0 
        			}, 
        		hideAfter: 5000
        		});
	
        }else{
            $.ajax({
                url: Url,
                type: 'GET',
                success: function (data) {
                    $('#loader').modal('hide');

                    $("#alertmsg").text(data);
    				$('#alert').modal("toggle");
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    $('#loader').modal('hide');
                    console.error('Download error:', textStatus, errorThrown, jqXHR);

                    let errorMessage = 'An error occurred while downloading the file. Please try again.';
                    if (jqXHR.response) {
                        const reader = new FileReader();
                        reader.onload = function () {
                            errorMessage = reader.result;
                            showResultModal('Error', errorMessage);
                        };
                        reader.onerror = function () {
                            showResultModal('Error', 'An unknown error occurred during download.');
                        };
                        reader.readAsText(jqXHR.response);
                        return;
                    }
                    showResultModal('Error', errorMessage);
                }
            });
            }

}
	function adjustHeight() {
		const cardBody = document.getElementById("cardBody");
		const viewportHeight = window.innerHeight;
		cardBody.style.maxHeight = `${viewportHeight * 0.80}px`; // Adjust 80% of the viewport height
	}

	window.addEventListener("resize", adjustHeight);
	document.addEventListener("DOMContentLoaded", adjustHeight);
</script>
</head>
<title>BRECON</title>
<body>
	<div th:insert="XBRLHeaderMenu :: header"></div>
	<!---------------------------------------------------Starts------------------------------------------------------->
	<div class="container-fluid py-5">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<div class="card shadow-lg border-0" style="border-radius: 16px;">
					<!-- Header -->
					<div class="card-header text-center"
						style="background: #376275; border-top-left-radius: 16px; border-top-right-radius: 16px; position: relative;">
						<!-- Centered title -->
						<h4 class="text-white m-0 text-center">
							<i class="fas fa-copy mr-2" style="color: lightblue;"></i> Delete Report

						</h4>
					</div>
					<form action="#" th:object="${userProfile}" method="post"
						autocomplete="off" id="userProfile">
						<div class="card-body p-3">
							<input autocomplete="false" name="hidden" type="text"
								style="display: none;">
							<!-- Form Fields -->
							<div class="form-group">
								<div class="row formline mb-2">
									<div class="col-sm-2">
										<label for="Cur">Recon Type</label>
									</div>
									<div class="col-sm-2">
										<select id="Cur" class="form-control form-control-sm"
											autocomplete="off">
											<option value="">Select</option>
											<option value="DEBIT">Debit Card</option>
											<option value="CREDIT">Credit Card</option>
											<option value="UPI">UPI</option>
											
										</select>
									</div>
									<div class="col-sm-2"></div>
									<div class="col-sm-2">
										<label for="Date">Recon Date</label>
									</div>
									<div class="col-sm-2">
										<input type="Date" id="RECONDate" name="Date"
											class="form-control form-control-sm" />
									</div>
								</div>
							</div>
						</div>
						<!-- Footer Buttons -->
						<div class="card-footer bg-white text-center p-1"
							style="border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="home()" style="border-radius: 6px;">
								<i class="fas fa-home me-1"></i> Home
							</button>
							<button type="button" class="btn btn-outline-dark me-3"
								form="IPSAccessRole" th:attr="data-formmode=${formmode}"
								onclick="SubmitReport();">
								<i class="fas fa-upload me-1"></i> &nbsp;Submit
							</button>
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="back()" style="border-radius: 6px;">
								<i class="fas fa-angle-left me-1"></i> Back
							</button>
						</div>
					</form>

				

				</div>
				<!--end-->
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="alert">
		<div
			class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-body" style="text-align: center; font-size: 16px;">
					<p id="alertmsg"></p>
					<button type="button" class="btn btn-sm  mx-1"
						style="background-color: #376275; color: white;"
						data-dismiss="modal" onclick="Success();">Close</button>
				</div>
			</div>
		</div>
	</div>
	<!-- --------------------------------------------------------------------end----------------------------------------------------- -->
</body>
