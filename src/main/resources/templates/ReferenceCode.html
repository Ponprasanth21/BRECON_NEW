<script type="text/javascript">

	function modify_btn(a) {
		var id = a.getAttribute("data-modify");
		location.href = './refcode?formmode=modify&ref_id=' + id;
	}
	function cancelform(a) {

<script type="text/javascript">
	// ADD REF
	function submitform(a) {
    var refId = document.getElementById("refId").value;

    if (!refId) {
        $.toast({
            heading: 'Warning',
            text: 'Please enter a Reference ID.',
            icon: 'warning',
            position: 'bottom-right'
        });
        return false;
    }

    // ✅ Base URL with Thymeleaf context path (auto injects /BRECON if set)
    var baseUrl = /*[[@{/}]]*/ '';

    // ✅ First check for duplicate Reference ID
    $.ajax({
    	 url: './refcodeadd?formmode=add',
        data: { ref_id: refId },   // must match @RequestParam("ref_id")
        type: 'POST',
        success: function(responseText) {
            if (responseText === 'Match') {
                $.toast({
                    heading: 'Warning',
                    text: 'Hold on! Reference ID "' + refId + '" already exists. Please try a different name.',
                    icon: 'warning',
                    position: 'bottom-right'
                });
                return false;
            } else {
                // ✅ No duplicate → submit form via AJAX
                if ($("#adminRefCodeMaster").valid()) {
                    var url = baseUrl + "refcodeadd?formmode=add";
                    $("#adminRefCodeMaster").ajaxSubmit({
                        url: url,
                        type: 'POST',
                        success: showResponse,
                        error: handleError
                    });
                }
            }
        },
        error: function(xhr) {
            $.toast({
                heading: 'Error',
                text: xhr.responseText || "Could not check for duplicates.",
                icon: 'error',
                position: 'bottom-right'
            });
        }
    });

    // ✅ Success handler
    function showResponse(responseText) {
        $.toast({
            heading: 'Success',
            text: responseText || 'New entry saved!',
            icon: 'success',
            showHideTransition: 'plain',
            position: { left: 1600, top: 0 },
            loaderBg: '#376275',
            hideAfter: 3000
        });

        setTimeout(function() {
            location.href = baseUrl + "refcode?formmode=list";
        }, 3100);
    }

    // ✅ Error handler
    function handleError(xhr) {
        var errorMessage = xhr.responseText
            || "An error occurred while processing your request. Please try again.";
        $.toast({
            heading: 'Error',
            text: errorMessage,
            icon: 'error',
            showHideTransition: 'plain',
            position: { left: 1600, top: 0 },
            loaderBg: '#dc3545',
            hideAfter: 5000
        });
    }
}
	// MODIFY REF
	function modifyUserData() {
		var refId = document.getElementById("ref_Id_modify").value;
		if ($("#adminRefCodeMaster").valid()) {
			var url = "./adminRefCodeMasterAdd?formmode=modify&ref_id="
					+ encodeURIComponent(refId);
			$("#adminRefCodeMaster").attr('action', url);
			var options = {
				success : showResponse,
				error : handleError
			};
			$("#adminRefCodeMaster").ajaxSubmit(options);
		}
		function showResponse(responseText, statusText, xhr, $form) {
			$.toast({
				heading : 'Success',
				text : responseText,
				icon : 'success',
				showHideTransition : 'plain',
				position : {
					left : 1600,
					top : 0
				}, // or any standard position like 'top-center'
				loaderBg : '#376275',
				hideAfter : 3000
			});

			// Delay the redirect to allow user to see toast
			setTimeout(function() {
				location.href = 'refcode?formmode=list';
			}, 3100); // Wait just a bit longer than toast duration 
		}

		function handleError(xhr, statusText, error) {
			var errorMessage = xhr.responseText
					|| "An error occurred while processing your request. Please try again.";
			$.toast({
				heading : 'Error',
				text : errorMessage,
				icon : 'error',
				showHideTransition : 'plain',
				position : {
					left : 1600,
					top : 0
				},
				loaderBg : '#dc3545',
				hideAfter : 5000
			});
		}
	}
	// DELETE REF
	function deleteRef(element) {
		$("#datacancel").hide();
		var refId = element.getAttribute("data-delete");
		$.ajax({
					url : './refcodedelete',
					data : {
						refId : refId
					},
					type : 'POST',
					success : function(responseText, statusText, xhr) {
						$.toast({
							heading : 'Success',
							text : 'Deletion complete!',
							icon : 'success',
							showHideTransition : 'plain',
							position : {
								left : 1600,
								top : 0
							}, // or any standard position like 'top-center'
							loaderBg : '#376275',
							hideAfter : 3000
						});
						setTimeout(function() {
							location.href = 'refcode?formmode=list';
						}, 3100);
					},
					error : function(xhr, status, error) {
						var errorMessage = xhr.responseText
								|| "An error occurred while processing your request. Please try again.";
						$.toast({
							heading : 'Error',
							text : errorMessage,
							icon : 'error',
							showHideTransition : 'plain',
							position : {
								left : 1600,
								top : 0
							},
							loaderBg : '#dc3545',
							hideAfter : 5000
						});
					}
				});
	}
</script>
<script>
	document.addEventListener("DOMContentLoaded", function() {
		var refTypeDropdown = document.getElementById("refType11");
		var typeDescField = document.getElementById("typeDesc11");

		if (refTypeDropdown && typeDescField) {
			refTypeDropdown.addEventListener("change", function() {
				var selectedValue = this.value;
				var desc = "";
				switch (selectedValue) {
				case "C001":
					desc = "Country Code";
					break;
				case "B001":
					desc = "Branch Code";
					break;
				case "S001":
					desc = "Sol Type";
					break;
				default:
					desc = "";
					break;
				}
				typeDescField.value = desc.toUpperCase();
			});
		}
	});
</script>

	}

	window.addEventListener("resize", adjustHeight);
	document.addEventListener("DOMContentLoaded", adjustHeight);
</script>

					style="margin-top: 8px; text-align: center; color: aliceblue;">
					<button type="button" class="close" data-dismiss="modal">×</button>
					<a th:value="${msg}"></a>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-outline-dark me-3"
						onclick="submitformdelete(this);" th:attr="data-formmode=delete">Submit</button>
					<button type="button" class="btn btn-outline-dark me-3"
						data-dismiss="modal">Cancel</button>
				</div>
			</div>
		</div>
	</div>
	</div>
	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="datacancel" style="background: #000000b0;"
		role="dialog" aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div
			class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
			role="document">
			<div class="modal-content">

				<!-- Modal Header -->


				<!-- Modal Body -->
				<div class="modal-body">
					<h5 style="font-size: 17px; color: black; padding: 15px;">Are
						you sure you want to delete the Reference Code?</h5>
				</div>
				<!-- Modal Footer -->
				<div style="padding: 10px; text-align: center;">
					<button type="button" class="btn btn-outline-dark me-3"
						style="font-size: 16px;" onclick="$('#datacancel').modal('hide')">Cancel</button>
					<button type="button" class="btn btn-outline-dark me-3"
						id="refDelete" style="font-size: 16px;" onclick="deleteRef(this);"
						th:attr="data-formmode=delete">Yes, Delete</button>
				</div>

			</div>
		</div>
	</div>
</body>
</html>
