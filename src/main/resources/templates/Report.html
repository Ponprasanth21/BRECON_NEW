<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.btns {
	float: right;
	margin: 5px;
}

td {
	padding: 0.30rem !important;
}

.col-sm-5 {
	padding-bottom: 15px;
}

.list-body {
	padding: 0px;
}

.container-manager {
	padding-right: 43px;
	padding-left: 15px;
	margin-right: auto;
	margin-left: 18.3%;
	margin-top: 80px;
}

.error {
	color: red;
	padding-left: 10px;
}

.formline {
	padding-bottom: 5px;
}

.btn-primary {
	background-color: #2c4e5e;
	border-color: white;
}

.btn-primary:not (:disabled ):not (.disabled ).active, .btn-primary:not
	 (:disabled ):not (.disabled ):active, .show>.btn-primary.dropdown-toggle
	{
	color: #fff;
	background-color: #cc000000;
	border-color: #161617;
}

.dataTables_wrapper .dataTables_paginate .paginate_button {
	padding: 0px;
}

.valids {
	color: green;
}

.invalids {
	color: red;
}
</style>
<style>
.dataTables_wrapper {
	width: 100% !important;
}

table.dataTable {
	width: 100% !important;
}

.user-profile-wrapper {
	width: 100%;
	padding: 0 20px; /* optional spacing */
}
/* Expand the card or box */
.card {
	width: 100% !important;
}
/* Make table fill full width */
table.dataTable {
	width: 100% !important;
}
/* Optional: make header also full width */
.user-profile-wrapper {
	width: 100%;
}
/* Match list screen font style and size */
.card, .card-body, .form-group, .form-control, .btn, label {
	font-family: Arial, sans-serif;
	font-size: 14px;
}

.card-header h5, .card-header h4 {
	font-weight: bold;
	font-size: 16px;
}

.form-control-sm {
	font-size: 14px;
}

.btn-sm {
	font-size: 13px;
}
</style>
<script th:inline="javascript">
	function home() {
		location.href = 'Dashboard'
	}
	function back() {
		window.history.back();
	}
	function view() {
		location.href = 'Follow_up?formmode=view';
	}
</script>
<script>
function submitform() {
    const curr = document.getElementById("Cur").value;
    const date = document.getElementById("Date").value;
    const type ="Cr";
    if (!date) {
        alert("Please select a date.");
        return;
    }

    const [year, month, day] = date.split("-");
    const formattedDate = `${day}-${month}-${year}`;
    const filetype = 'EXCEL';

    $('#loader').modal('show');

    // Build download URL
    const downloadUrl = 'ReconDownload' +
        '?Cur=' + encodeURIComponent(curr) +
        '&type=' + encodeURIComponent(type) +
        '&filetype=' + encodeURIComponent(filetype) +
        '&recon_date=' + encodeURIComponent(formattedDate);

    // Use window.location to trigger download
    window.location.href = downloadUrl;

    $('#loader').modal('hide');
}
</script>
</head>
<title>BRECON</title>
<body>
	<div th:insert="XBRLHeaderMenu :: header"></div>
	<!-- --------------------------------------------------------------------User List Starts----------------------------------------------------- -->
	<div class="container-fluid py-5">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<div class="card shadow-lg border-0" style="border-radius: 16px;">
					<!-- Header -->
					<div class="card-header text-center"
						style="background: #376275; border-top-left-radius: 16px; border-top-right-radius: 16px; position: relative;">
						<!-- Centered title -->
						<h4 class="text-white m-0 text-center">
							<i class="fas fa-clipboard-list mr-2" style="color: lightblue;"></i>
							Recon Report
						</h4>
					</div>
					<!-- Form Body -->
					<form action="#" th:object="${userProfile}" method="post"
						autocomplete="off" id="userProfile">
						<div class="card-body p-3">
							<input autocomplete="false" name="hidden" type="text"
								style="display: none;">
							<!-- Form Fields -->
							<div class="form-group">
								<div class="row formline mb-2">
									<div class="col-sm-2">
										<label for="Cur">Cur</label>
									</div>
									<div class="col-sm-2">
										<select id="Cur" class="form-control form-control-sm"
											autocomplete="off"  >
											<option value="O">Select</option>
											<option value="MUR">MUR</option>
											<option value="USD">USD</option>
											<option value="AED">AED</option>
										</select>
									</div>
									<div class="col-sm-2"></div>
									<div class="col-sm-2">
										<label for="Date">Recon Date</label>
									</div>
									<div class="col-sm-2">
										<input type="Date" id="Date" name="Date"
											class="form-control form-control-sm" />
									</div>
								</div>
							</div>
						</div>
						<!-- Footer Buttons -->
						<div class="card-footer bg-white text-center p-1"
							style="border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="home()" style="border-radius: 6px;">
								<i class="fas fa-angle-left me-1"></i> Home
							</button>
							<button   type="button"
								class="btn btn-outline-dark me-3" form="IPSAccessRole"
								th:attr="data-formmode=${formmode}" onclick="submitform(this);">
								<i class="fas fa-upload me-1"></i> &nbsp;Download
							</button>
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="back()" style="border-radius: 6px;">
								<i class="fas fa-angle-left me-1"></i> Back
							</button>
						</div>
					</form>
				</div>
				<!--end-->
			</div>
		</div>
	</div>
	<!-- --------------------------------------------------------------------end----------------------------------------------------- -->
</body>
</html>
