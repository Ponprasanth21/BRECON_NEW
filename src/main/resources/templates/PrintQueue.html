<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.btns {
	float: right;
	margin: 5px;
}

td {
	padding: 0.30rem !important;
}

.col-sm-5 {
	padding-bottom: 15px;
}

.list-body {
	padding: 0px;
}

.container-manager {
	padding-right: 43px;
	padding-left: 15px;
	margin-right: auto;
	margin-left: 18.3%;
	margin-top: 80px;
}

.error {
	color: red;
	padding-left: 10px;
}

.formline {
	padding-bottom: 5px;
}

.btn-primary {
	background-color: #2c4e5e;
	border-color: white;
}

.btn-primary:not (:disabled ):not (.disabled ).active, .btn-primary:not
	 (:disabled ):not (.disabled ):active, .show>.btn-primary.dropdown-toggle
	{
	color: #fff;
	background-color: #cc000000;
	border-color: #161617;
}

.dataTables_wrapper .dataTables_paginate .paginate_button {
	padding: 0px;
}

.valids {
	color: green;
}

.invalids {
	color: red;
}
</style>
<style>
.dataTables_wrapper {
	width: 100% !important;
}

table.dataTable {
	width: 100% !important;
}

.user-profile-wrapper {
	width: 100%;
	padding: 0 20px; /* optional spacing */
}
/* Expand the card or box */
.card {
	width: 100% !important;
}
/* Make table fill full width */
table.dataTable {
	width: 100% !important;
}
/* Optional: make header also full width */
.user-profile-wrapper {
	width: 100%;
}
/* Match list screen font style and size */
.card, .card-body, .form-group, .form-control, .btn, label {
	font-family: Arial, sans-serif;
	font-size: 14px;
}

.card-header h5, .card-header h4 {
	font-weight: bold;
	font-size: 16px;
}

.form-control-sm {
	font-size: 14px;
}

.btn-sm {
	font-size: 13px;
}
</style>
<script th:inline="javascript">
	function home() {
		location.href = 'Dashboard'
	}
	function back() {
		window.history.back();
	}
	function view() {
		location.href = 'Follow_up?formmode=view';
	}
</script>
<script>
	function adjustHeight() {
		const cardBody = document.getElementById("cardBody");
		const viewportHeight = window.innerHeight;
		cardBody.style.maxHeight = `${viewportHeight * 0.80}px`; // Adjust 80% of the viewport height
	}

	window.addEventListener("resize", adjustHeight);
	document.addEventListener("DOMContentLoaded", adjustHeight);
</script>
</head>
<title>BRECON</title>
<body>
	<div th:insert="XBRLHeaderMenu :: header"></div>
	<!---------------------------------------------------Starts------------------------------------------------------->
	<div class="container-fluid py-5">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<div class="card shadow-lg border-0" style="border-radius: 16px;">
					<!-- Header -->
					<div class="card-header text-center"
						style="background: #376275; border-top-left-radius: 16px; border-top-right-radius: 16px; position: relative;">
						<!-- Centered title -->
						<h4 class="text-white m-0 text-center">
							<i class="fas fa-copy mr-2" style="color: lightblue;"></i> PRINT QUEUE

						</h4>
					</div>
					<div class="card-body p-3" id="cardBody" style="overflow-y:auto;">
						<div class="table-responsive">
							<table class="table table-bordered table-hover table-sm"
								style="font-family: Verdana; font-size: 13px;">
								<thead class="thead-light" style="background-color: #e9ecf0;">
									<tr>
										<th >SL NO</th>
										<th>Report Code</th>
										<th>Report Name</th>
										<th>Location</th>
										<th>Report Date</th>
										<th>Generated On</th>
										<th>Generated By</th>
									</tr>
								</thead>
								<tbody th:if="${List == null or #lists.isEmpty(List)}"
									id="bodyhide">
									<tr>
										<td colspan="7" class="text-center text-muted">No data
											available</td>
									</tr>
								</tbody>
								<tbody id="Engine">
									<tr th:each="item , Seq : ${List}" class="dynamic-row">
										<td th:text="${Seq.index + 1}" class="text-center"></td>
										<td th:text="${item?.rpt_code}"  ></td>
										<td th:text="${item?.rpt_name}" ></td>
										<td th:text="${item?.rpt_location}"></td>
										<td th:text="${#dates.format(item?.rpt_date, 'dd-MM-yyyy')}" class="text-right"></td>
										<td  class="text-right" th:text="${#dates.format(item?.gen_date, 'dd-MM-yyyy')}"></td>
										<td th:text="${item?.gen_by}"></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>

					<!-- Footer Buttons -->
							<div class="card-footer bg-white text-center p-1"
							style="border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="home()" style="border-radius: 6px;">
								<i class="fas fa-home me-1"></i> Home
							</button>
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="back()" style="border-radius: 6px;">
								<i class="fas fa-angle-left me-1"></i> Back
							</button>
						</div>

				</div>
				<!--end-->
			</div>
		</div>
	</div>
	<!-- --------------------------------------------------------------------end----------------------------------------------------- -->
</body>
</html>
