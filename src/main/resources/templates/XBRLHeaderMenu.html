/* Dropdown Menu */

.dropdown-menu li {

.dropdown-menu a {

}

.dropdown-menu a:hover {
	background: rgba(27, 145, 174, 0.17);
	color: #ff0000 !important;
}

/* Navbar dropdown hover behavior */
.nav-item.dropdown {
	position: relative;
}

.nav-item.dropdown:hover>.dropdown-menu {
	display: block;
	opacity: 1;
	visibility: visible;
	transform: translateY(0);
}

/* Dropdown menu hidden state */
.dropdown-menu {
	display: block;
	opacity: 0;
	visibility: hidden;
	transform: translateY(10px);
	transition: all 0.25s ease;
	position: absolute;
	top: 100%;
	left: 0;
	min-width: 180px;
	background: rgba(255, 255, 255, 0.07);
	backdrop-filter: blur(16px);
	border-radius: 10px;
	border: 1px solid rgba(27, 145, 174, 0.13);
	box-shadow: 0 8px 36px rgba(27, 145, 174, 0.08);
	z-index: 1000;
	padding: 10px 0;
}

/* Dropdown links */
.dropdown-menu li a {
	color: #163760 !important;
	padding: 10px 20px;
	display: block;
	font-weight: bold;
	text-decoration: none;
	border-radius: 6px;
	white-space: nowrap;
	/* Prevent text from wrapping */
	position: relative;
	background: transparent;
	transition: background 0.2s ease, color 0.2s ease;
}

/* Hover styling for dropdown items */
.dropdown-menu li a:hover {
	background: rgba(27, 145, 174, 0.17);
	color: #f00 !important;
	/* RED on hover */
}

/* Shine effect */
.dropdown-menu li a::before {
	content: '';
	position: absolute;
	left: -60%;
	top: 0;
	width: 60%;
	height: 100%;
	background: linear-gradient(120deg, rgba(255, 255, 255, 0) 0%,
		rgba(255, 255, 255, 0.55) 60%, rgba(255, 255, 255, 0) 100%);
	transform: skewX(-30deg);
	transition: left 0.8s cubic-bezier(0.3, 0.35, 0.3, 1);
	pointer-events: none;
}

.dropdown-menu li a:hover::before {
	left: 120%;
}

/* Shine Effect */
/* Basic link styling */
.shine-effect {
	position: relative;
	display: inline-block;
	padding: 10px 20px;
	color: #fff;
	text-decoration: none;
	overflow: hidden;
	z-index: 1;
}

/* Shine effect layer */
.shine-effect::before {
	content: '';
	position: absolute;
	top: 0;
	left: -75%;
	width: 50%;
	height: 100%;
	background: linear-gradient(120deg, rgba(255, 255, 255, 0) 0%,
		rgba(255, 255, 255, 0.5) 50%, rgba(255, 255, 255, 0) 100%);
	transform: skewX(-20deg);
	z-index: 2;
	pointer-events: none;
}

/* Move the shine across on hover */
.shine-effect:hover::before {
	left: 130%;
	transition: left 0.6s ease-in-out;
}

.nav-links>.nav-item>a:hover::before, .dropdown-menu li a:hover::before
	{
	left: 120%;
	transition: left 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

<script type="text/javascript">
		document.addEventListener("DOMContentLoaded", function () {
			let menuTimeout;
			// Function to show menu
			function showMenu(menu) {
				clearTimeout(menuTimeout);
				menu.style.display = "block";
			}

			// Function to hide menu with delay
			function hideMenu(menu) {
				menuTimeout = setTimeout(() => {
					menu.style.display = "none";
				}, 200); // 200ms delay
			}

			// Handle main dropdown menu hover (e.g., "Orders")
			const mainMenus = document.querySelectorAll('.nav-item.dropdown');
			mainMenus.forEach(menu => {
				menu.addEventListener("mouseenter", function () {
					let dropdownMenu = this.querySelector(".dropdown-menu");
					if (dropdownMenu) showMenu(dropdownMenu);
				});
				menu.addEventListener("mouseleave", function () {
					let dropdownMenu = this.querySelector(".dropdown-menu");
					if (dropdownMenu) hideMenu(dropdownMenu);
				});
			});

			// Handle submenus inside dropdown (e.g., "Purchase", "Sale")
			const submenus = document.querySelectorAll('.dropdown-submenu');
			submenus.forEach(submenu => {
				submenu.addEventListener("mouseenter", function () {
					let subMenuElement = this.querySelector(".dropdown-menu");
					if (subMenuElement) showMenu(subMenuElement);
				});
				submenu.addEventListener("mouseleave", function () {
					let subMenuElement = this.querySelector(".dropdown-menu");
					if (subMenuElement) hideMenu(subMenuElement);
				});
			});

			// Close menus when clicking outside
			document.addEventListener("click", function (e) {
				if (!e.target.closest(".dropdown")) {
					document.querySelectorAll('.dropdown-menu').forEach(menu => {
						menu.style.display = "none";
					});
				}
			});
		});
	</script>

<script>
		document.addEventListener("DOMContentLoaded", function () {
			let navLinks = document.querySelectorAll(".nav-second-level .nav-link");
			let dashboardLink = document.getElementById("Dashboard");
			// Check if the reset flag is present
			let resetMenu = document.body.getAttribute("data-reset-menu");
			if (resetMenu === "true") {
				// Remove active class from all menu items
				navLinks.forEach(item => item.classList.remove("active"));
				// Set only Dashboard as active
				if (dashboardLink) {
					dashboardLink.classList.add("active");
				}
				// Clear localStorage to prevent old selections from persisting
				localStorage.setItem("activeMenu", "Dashboard");
			}
		});
		document.addEventListener("DOMContentLoaded", function () {
			let navLinks = document.querySelectorAll(".nav-second-level .nav-link");
			let homeButton = document.querySelector(".home-button");
			// Retrieve last clicked menu item from localStorage
			let activeMenu = localStorage.getItem("activeMenu");
			if (activeMenu) {
				let activeElement = document.getElementById(activeMenu);
				if (activeElement) {
					activeElement.classList.add("active");
					let parentMenu = activeElement.closest(".collapse");
					while (parentMenu) {
						parentMenu.classList.add("show");
						let parentLink = document.querySelector(`[data-target="#${parentMenu.id}"]`);
						if (parentLink) {
							parentLink.setAttribute("aria-expanded", "true");
						}
						parentMenu = parentMenu.parentElement.closest(".collapse");
					}
				}
			}
			// Add click event listeners to menu items
			navLinks.forEach(function (link) {
				link.addEventListener("click", function () {
					// Remove active class from all links
					navLinks.forEach(item => item.classList.remove("active"));
					// Add active class to the clicked link
					this.classList.add("active");
					// Store the clicked menu ID in localStorage
					localStorage.setItem("activeMenu", this.id);
				});
			});
		});

		// Function to Reset Active Menu and Set Dashboard Active
		function setDashboardActive() {
			let navLinks = document.querySelectorAll(".nav-second-level .nav-link");
			// Remove active class from all links
			navLinks.forEach(item => item.classList.remove("active"));
			// Set "Dashboard" as active
			let dashboardLink = document.getElementById("Dashboard");
			if (dashboardLink) {
				dashboardLink.classList.add("active");
				localStorage.setItem("activeMenu", "Dashboard");
			}
		}
		//inventories..
		document.addEventListener("DOMContentLoaded", function () {
			// Handle Inventory menu click separately
			let inventoryMenu = document.getElementById("Inventory_po");
			if (inventoryMenu) {
				inventoryMenu.addEventListener("click", function () {
					// Remove highlight from all menus
					document.querySelectorAll(".nav-item .nav-link").forEach(link => {
						link.classList.remove("active");
					});
					// Highlight the clicked Inventory menu
					inventoryMenu.classList.add("active");
					// Remove active state from localStorage for other menus
					localStorage.removeItem("activeMenu");
					localStorage.removeItem("activeModule");
				});
				// If Inventory menu is active (from localStorage or page load), keep it highlighted
				let activeModule = localStorage.getItem("activeModule");
				if (activeModule === "Inventory_po") {
					inventoryMenu.classList.add("active");
				}
			}
		});

		function clickPhoto1(a) {
			var userid = document.getElementById("userid").textContent;
			$.ajax({
				type: 'GET',
				url: "./getUserBlobImage/" + encodeURIComponent(userid),
				success: function (response) {
					if (response && response.length > 100) { // Quick check for valid base64 length
						const imageSrc = "data:image/jpeg;base64," + response; // Use 'image/png' if your image is PNG
						$('#doc_image').attr('src', imageSrc);
						$('#imageshow').modal('show');
					} else {
						showImageLoadError();
					}
				},
				error: function () {
					showImageLoadError();
				}
			});

			function showImageLoadError() {
				$('#myModalpopup1').modal("toggle");
				$('#myModalpopup1 .modal-body').text(
					"Failed to load the image. Please try again later.");
			}

		}

		function closeimage() {
			$('#imageshow').modal('hide');
		}
	</script>
