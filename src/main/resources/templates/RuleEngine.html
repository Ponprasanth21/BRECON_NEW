<script>
/*  format for decimal*/
function formatTolerance(input) {
    let value = parseFloat(input.value.replace(/,/g, ''));
    if (!isNaN(value)) {
        input.value = value.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    }
}
function allowNumbersOnly(input) {
    // Remove anything except digits and a single period
    input.value = input.value
        .replace(/[^\d.]/g, '')        // Remove non-digits/non-period
        .replace(/(\..*)\./g, '$1');   // Allow only one period
}

   /* edit function */
   function editRow(icon) {

    submitbutton.classList.remove("d-none");

    // Toggle back to original row view
    if (row.getAttribute("data-editing") === "true") {
        row.innerHTML = row.getAttribute("data-original-html");
        row.removeAttribute("data-editing");
        return;
    }

    // Store the original HTML to restore later
    row.setAttribute("data-original-html", row.innerHTML);
    row.setAttribute("data-editing", "true");

    const cells = row.querySelectorAll('td');
    const values = Array.from(cells).map(cell => cell.textContent.trim());

/* add new version code */
let versionMap = {}; // Keeps track of latest version per ruleCode

function addNewVersion(icon) {
    const submitbutton = document.getElementById("submitbutton");
    submitbutton.classList.remove("d-none");

    const clickedRow = icon.closest("tr");
    const cells = clickedRow.querySelectorAll("td");
    const ruleCode = cells[0].innerText.trim();

    // If version already exists in local map, increment from it
    if (versionMap[ruleCode]) {
        versionMap[ruleCode] += 1;
        appendNewVersionRow(clickedRow, ruleCode, versionMap[ruleCode]);
    } else {
        // Else fetch max version from backend
$.ajax({
    url: './getMaxVersion?ruleCode=' + ruleCode,
    type: 'GET',
    contentType: 'application/json',
    success: function (response) {
        const newVersion = parseInt(response || 0) + 1;
        versionMap[ruleCode] = newVersion; // Save to local map
        appendNewVersionRow(clickedRow, ruleCode, newVersion);
    },
    error: function (error) {
        console.error("Submission Error:", error.responseText);
        alert("Failed to fetch version. Please try again.");
    }
});
    }
}

function appendNewVersionRow(clickedRow, ruleCode, newVersion) {
    const row = document.createElement("tr");
    row.classList.add("dynamic-row");
    row.innerHTML = `
        <td><input type="text" name="rule_code" class="form-control" value="${ruleCode}" readonly /></td>
        <td><input type="number" name="version" class="form-control text-center" value="${newVersion}" readonly /></td>

        <td><input type="text" name="match_type" class="form-control" value="" /></td>
        <td><select name="internal_ref" class="form-control">${generateOptions("")}</select></td>
        <td><select name="external_ref" class="form-control">${generateOptions("")}</select></td>
        <td><input type="date" name="value_date" class="form-control" value="" /></td>
        <td><input type="text" name="amount_type" class="form-control" value="" /></td>
        <td><input type="text" name="tolerance" class="form-control text-right" value="" onblur="formatTolerance(this)" oninput="allowNumbersOnly(this)" /></td>
        <td><input type="text" name="match_status" class="form-control" value="" /></td>
        <td><input type="text" name="adjustment_entry" class="form-control" value="" /></td>
        <td><input type="number" name="matching_sequence" class="form-control" value="" /></td>
        <td><input type="text" name="remarks" class="form-control" value="" /></td>
        <td class="text-center">
            <i class="fa fa-minus-circle" aria-hidden="true" style="font-size: 14px; color:red; cursor:pointer;" onclick="deleteRowtemp(this)"></i>
        </td>
    `;
    let lastRow = clickedRow;
    let next = clickedRow.nextElementSibling;
    while (next) {
        const input = next.querySelector("input[name='rule_code']");
        if (input && input.value === ruleCode) {
            lastRow = next;
        }
        next = next.nextElementSibling;
    }

    lastRow.parentNode.insertBefore(row, lastRow.nextSibling);
}

    if (parts.length === 3) {

    return "";
}

               style="font-size: 13px; color: #376275; cursor: pointer;"
               onclick="editRow(this)"></i>
            <i class="fa fa-minus-circle" title="Cancel"
               aria-hidden="true"
               style="font-size: 13px; cursor: pointer; color: #376275;"
               onclick="cancelform(this)"></i>
        </td>
    `;
}
/*  verify function  */
  
  function Verifyform(a){
		var unique = a.getAttribute("data-unique");
		$.toast({
			heading : 'Verified!',
            text : "Verification complete!",
			icon : 'success',
			showHideTransition : 'plain',
			position : {
				left : 1400,
				top : 0
			},
			loaderBg : '#376275',
			hideAfter : 3000
		}); 
		setTimeout(function() { location.reload(); }, 9000);
	}
  
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const tbody = document.getElementById("Engine");

    tbody.addEventListener("keyup", function (event) {
        const target = event.target;
        if (target.matches('input[type="text"]')) {
            target.value = target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        }
    });
});
</script>

</head>
<title>BRECON</title>
<body>
	<div th:insert="XBRLHeaderMenu :: header"></div>
	<!-- --------------------------------------------------------------------User List Starts----------------------------------------------------- -->
	<div class="container-fluid py-5">
		<div class="row justify-content-center">
			<div class="col-lg-10">
				<div th:if="${formmode}=='list'">
					<div class="card shadow-lg border-0" style="border-radius: 16px;">
						<div class="card-header text-center"
							style="background: #376275; border-top-left-radius: 16px; border-top-right-radius: 16px;">
							<h4 class="text-white m-0">
								<i class="fas fa-robot mr-2" style="color: lightblue;"></i> Rule
								Engine&nbsp; <i class="fas fa-plus-circle  ml-2"
									id="addRateIcon" title="add" onclick="Addrow(this)"
									style="cursor: pointer;"></i>
							</h4>
						</div>
						<div class="card-body p-2">
							<form action="#" method="post" autocomplete="off" id="RuleSubmit">
								<div class="table-responsive">
									<table class="table table-bordered table-hover table-sm"
										style="font-family: Verdana; font-size: 13px;">
										<thead class="thead-light" style="background-color: #e9ecf0;">
											<tr>
												<th>Rule Code</th>
												<th>Sub Rule</th>
												<th>Rule Srl No</th>
												<th>Description</th>
												<th>Match Type</th>
												<th>Internal Ref</th>
												<th>External Ref</th>
												<th>Value Date</th>
												<th>Amt Type</th>
												<th>Tolerane</th>
												<th>Match Status</th>
												<th title="Adjustment Entry">Adjust Entry</th>
												<th>Matching Seq</th>
												<th>Remarks</th>
												<th>Select</th>
											</tr>
										</thead>
										<tbody th:if="${list == null or #lists.isEmpty(list)}"
											id="bodyhide">
											<tr>
												<td colspan="15" class="text-center text-muted">No data
													available</td>
											</tr>
										</tbody>
										<tbody id="Engine">
											<tr th:each="item : ${list}" class="dynamic-row">
												<td th:text="${item?.rule_code}"></td>
												<td th:text="${item?.version}" class="text-center"></td>
												<td th:text="${item?.rule_srl}" class="text-center"></td>
												<td th:text="${item?.description}"></td>
												<td th:text="${item?.match_type}"></td>
												<td th:text="${item?.internal_ref}"></td>
												<td th:text="${item?.external_ref}"></td>
												<td
													th:text="${#dates.format(item?.value_date, 'dd-MM-yyyy')}"></td>
												<td th:text="${item?.amount_type}"></td>
												<td
													th:text="${#numbers.formatDecimal(item?.tolerance, 1, 4)}"
													class="text-right"></td>
												<td th:text="${item?.match_status}"></td>
												<td th:text="${item?.adjustment_entry}"></td>
												<td th:text="${item?.matching_sequence}"></td>
												<td th:text="${item?.remarks}"></td>
												<td hidden th:text="${item?.unique_id}"></td>
												<td class="text-center">
													<!-- edit --> 
													<i class="fas fa-edit"
													th:if="${item?.auth_flg == 'Y' OR userID == item.entry_user}"
													title="Edit" aria-hidden="true"
													style="font-size: 13px; color: #376275; cursor: pointer;"
													onclick="editRow(this)"></i> <!--new rule  --> <i
													class="fas fa-clone" title="Sub Rule" aria-hidden="true"
													th:if="${item?.auth_flg == 'Y' OR userID == item.entry_user}"
													style="font-size: 13px; cursor: pointer; color: #376275;"
													onclick="addNewVersion(this)"></i> 
													<!-- verify --> <i
													class="fas fa-check-to-slot" title="Veify"
													th:if="${item?.auth_flg == 'N' and userID != item.entry_user}"
													style="font-size: 13px; cursor: pointer; color: #376275;"
													th:attr="data-unique=${item?.unique_id}"
													onclick="Verifyform(this)"></i> 
													<!-- delete --> <i
													class="fa fa-minus-circle"
													th:if="${item?.auth_flg == 'Y' OR userID == item.entry_user}"
													th:attr="data-unique=${item?.unique_id}" aria-hidden="true"
													style="font-size: 13px; cursor: pointer; color: #376275;"
													title="Delete" onclick="cancelform(this)"></i>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</form>
						</div>
						<!-- Footer Buttons -->
						<div class="card-footer bg-white text-center p-1"
							style="border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="home()" style="border-radius: 6px;">
								<i class="fas fa-home me-1"></i> Home
							</button>
							<button type="button" id="submitbutton"
								class="btn btn-outline-dark me-3 d-none" onclick="SubmitRule()"
								style="border-radius: 6px;">
								<i class="fas fa-upload me-1"></i> &nbsp;Submit
							</button>
							<button type="button" class="btn btn-outline-dark me-3"
								onclick="back()" style="border-radius: 6px;">
								<i class="fas fa-angle-left me-1"></i> Back 
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- DELETE MODEL -->
	<div class="modal fade" id="datacancel" style="background: #000000b0;"
		role="dialog" aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div
			class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
			role="document">
			<div class="modal-content">

				<!-- Modal Header -->


				<!-- Modal Body -->
				<div class="modal-body">
					<h5 style="font-size: 17px; color: black; padding: 15px;">Are
						you sure you want to delete the Reference Code?</h5>
				</div>
				<!-- Modal Footer -->
				<div style="padding: 10px; text-align: center;">
					<button type="button" class="btn btn-outline-dark me-3"
						style="font-size: 16px;" onclick="$('#datacancel').modal('hide')">Cancel</button>
					<button type="button" class="btn btn-outline-dark me-3"
						id="refDelete" style="font-size: 16px;" onclick="deleteRow(this);"
						th:attr="data-formmode=delete">Yes, Delete</button>
				</div>

			</div>
		</div>
	</div>
</body>
</html>
