<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/favicon_bob.png}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BRECON</title>

    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/jquery-ui.min.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        :root {
            --brand: #386b7e;
            --brand-dark: #2c5667;
            --ink: #263746;
            --text: #111111;
            --muted: #6b7a88;
            --line: #d5dce2;
            --head-bg: #e9edf1;
            --head-hover: #dce3e9;
            --row-alt: #f7f9fb;
            --row-hover: #eaf2f5;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #f3f6f8;
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        .source-data-wrapper {
            width: 86%;
            margin: 40px auto;
        }

        .source-data-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(20, 40, 55, 0.14);
            overflow: visible;
        }

        .source-data-header {
            height: 46px;
            background: linear-gradient(180deg, var(--brand) 0%, var(--brand-dark) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: .3px;
            border-radius: 14px 14px 0 0;
        }
        .source-data-header i { margin-right: 8px; }

        .source-data-table-wrapper {
            padding: 14px 14px 6px 14px;
            box-sizing: border-box;
            overflow: visible;
        }

        /* Category Nav */
        .category-nav-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            font-size: 13px;
            border: 1px solid var(--line);
            border-radius: 10px 10px 0 0;
            background: var(--head-bg);
        }

        .category-nav-table th {
            padding: 0;
            height: 42px;
            vertical-align: middle;
            white-space: nowrap;
            border-bottom: 2px solid var(--brand);
            border-right: 1px solid var(--line);
            position: relative;
        }
        .category-nav-table th:first-child { border-top-left-radius: 9px; }
        .category-nav-table th:last-child  { border-top-right-radius: 9px; border-right: none; }

        .source-header-clickable {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 0 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            color: var(--ink);
            box-sizing: border-box;
            transition: all 0.15s ease;
        }
        .source-header-clickable:hover {
            background: var(--head-hover);
            color: var(--brand-dark);
        }
        .source-header-clickable.active {
            background: #ffffff;
            color: var(--brand);
            box-shadow: inset 0 -3px 0 var(--brand);
        }

        .source-header-clickable .source-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            background: #cbd5e1;
            color: #334155;
            font-weight: normal;
        }
        .source-header-clickable.has-data .source-badge {
            background: #28a745;
            color: #ffffff;
            font-weight: bold;
        }

        /* Dropdowns */
        .dropdown-header-cell { overflow: visible !important; }
        .action-dropdown { position: relative; width: 100%; height: 42px; }

        .upload-btn, .header-action-btn {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: none;
            background: transparent;
            color: var(--ink);
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            letter-spacing: .3px;
            transition: background .15s ease;
        }
        .upload-btn:hover, .header-action-btn:hover { background: var(--head-hover); }
        .upload-btn i, .header-action-btn i { margin-right: 6px; color: var(--brand); }

        .dropdown-arrow { float: right; font-size: 11px; margin-top: 2px; transition: transform .15s ease; }
        .action-dropdown.open .dropdown-arrow { transform: rotate(180deg); }
        .action-dropdown.open .header-action-btn,
        .action-dropdown.open .upload-btn { background: var(--head-hover); }

        .action-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 100%;
            width: 170px;
            margin-top: 2px;
            background: #ffffff;
            border: 1px solid #c3ccd3;
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(20, 40, 55, 0.22);
            overflow: hidden;
            z-index: 9999;
            box-sizing: border-box;
        }
        .action-dropdown.open .action-dropdown-menu { display: block; }
        .action-dropdown-menu a {
            display: block;
            height: 38px;
            line-height: 38px;
            padding: 0 14px;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid #edf0f2;
        }
        .action-dropdown-menu a:last-child { border-bottom: none; }
        .action-dropdown-menu a:hover { background: var(--head-bg); color: var(--brand-dark); }
        .action-dropdown-menu a i { width: 18px; margin-right: 6px; color: var(--brand); }

        /* File List Area */
        .file-list-container {
            border: 1px solid var(--line);
            border-top: none;
            border-radius: 0 0 10px 10px;
            background: #ffffff;
            overflow: hidden;
        }

        .file-list-title-bar {
            padding: 10px 14px;
            background: #f8fafc;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--ink);
        }
        .file-list-title-bar strong { color: var(--brand-dark); font-size: 14px; }

        .dedicated-file-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .dedicated-file-table th {
            background: #f1f5f9;
            color: var(--ink);
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
        }
        .dedicated-file-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #edf2f7;
            color: var(--text);
            vertical-align: middle;
        }
        .dedicated-file-table tr:nth-child(even) td { background: var(--row-alt); }
        .dedicated-file-table tr:hover td { background: var(--row-hover); }
        .dedicated-file-table tr:last-child td { border-bottom: none; }

        .file-name-cell { font-weight: bold; color: var(--brand-dark); display: flex; align-items: center; gap: 8px; }
        .file-name-cell i { color: #1d6f42; font-size: 16px; }

        #uploadStatusMsg {
            display: none;
            padding: 10px;
            text-align: center;
            background: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
            font-size: 13px;
        }

        .badge-success-count {
            background: #dcfce7;
            color: #15803d;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #bbf7d0;
            display: inline-block;
        }

        .badge-zero-count {
            background: #fee2e2;
            color: #b91c1c;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #fecaca;
            display: inline-block;
        }

        .no-data {
            text-align: center !important;
            color: var(--muted) !important;
            padding: 46px 10px !important;
            font-size: 14px;
        }
        .no-data i { display: block; font-size: 30px; margin-bottom: 10px; color: #b4c2cc; }

        .source-data-footer {
            border-top: 1px solid #e3e8ec;
            padding: 10px 0;
            text-align: center;
            background: #ffffff;
            border-radius: 0 0 14px 14px;
        }
        .source-btn {
            display: inline-block;
            padding: 6px 14px;
            margin: 0 3px;
            background: #ffffff;
            border: 1px solid #8a98a3;
            border-radius: 6px;
            color: var(--ink);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        .source-btn:hover { background: var(--head-bg); border-color: var(--brand); color: #000; }
    </style>

    <script>
        var currentUploadType = "";
        var activeCategory = "ATM";

        var uploadedFilesStore = {
            CBS: [],
            ATM: [],
            POS: [],
            EPIN: [],
            VISANET: []
        };

        $(function () {
            var $upDd   = $('#uploadDropdown');
            var $upBtn  = $('#uploadButton');
            var $xlDd   = $('#excelDropdown');
            var $xlBtn  = $('#excelButton');

            // Upload Dropdown toggle
            $upBtn.on('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                $xlDd.removeClass('open');
                $upDd.toggleClass('open');
            });

            // Excel Dropdown toggle
            $xlBtn.on('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                $upDd.removeClass('open');
                $xlDd.toggleClass('open');
            });

            // Click outside closes menus
            $(document).on('click', function (e) {
                if (!$(e.target).closest('#uploadDropdown').length) { $upDd.removeClass('open'); }
                if (!$(e.target).closest('#excelDropdown').length) { $xlDd.removeClass('open'); }
            });

            // Keyboard Escape closes dropdowns
            $(document).on('keydown', function (e) {
                if (e.key === 'Escape') {
                    $upDd.removeClass('open');
                    $xlDd.removeClass('open');
                }
            });

            // Trigger file input for Upload
            $('#uploadMenu a').on('click', function (e) {
                e.preventDefault();
                currentUploadType = $(this).data('type');
                $upDd.removeClass('open');
                $('#excelFileInput').val('');
                $('#excelFileInput').click();
            });

            // Trigger Excel Download
            $('#excelMenu a').on('click', function (e) {
                e.preventDefault();
                var downloadType = $(this).data('type');
                $xlDd.removeClass('open');
                downloadCategoryExcel(downloadType);
            });

            // Upload execution
            $('#excelFileInput').on('change', function (e) {
                var file = e.target.files[0];
                if (!file) return;

                var formData = new FormData();
                formData.append("file", file);
                formData.append("type", currentUploadType);

                $('#uploadStatusMsg').show().html('<i class="fa fa-spinner fa-spin"></i> Uploading & parsing ' + file.name + ' (' + currentUploadType + ')...');

                $.ajax({
                    url: 'SourceDataUpload',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (res) {
                        $('#uploadStatusMsg').hide();
                        var now = new Date();
                        var formattedDate = now.toLocaleDateString() + " " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        // Extract inserted row count returned from Spring Boot
                        var rowsCount = (res && typeof res.insertedRows !== 'undefined') ? res.insertedRows : 0;

                        var record = {
                            id: Date.now(),
                            fileName: file.name,
                            uploadDate: formattedDate,
                            fileSize: (file.size / 1024).toFixed(2) + " KB",
                            recordsInserted: rowsCount
                        };

                        uploadedFilesStore[currentUploadType].push(record);
                        switchCategory(currentUploadType);
                        updateBadges();

                        alert("Upload Complete! " + rowsCount + " row(s) inserted into the database for " + currentUploadType + ".");
                    },
                    error: function (xhr) {
                        $('#uploadStatusMsg').hide();
                        var err = (xhr.responseJSON && xhr.responseJSON.message) ? xhr.responseJSON.message : xhr.statusText;
                        alert("Database upload failed: " + err);
                    }
                });
            });

            switchCategory('ATM');
        });

        function switchCategory(cat) {
            activeCategory = cat;
            $('.source-header-clickable').removeClass('active');
            $('[data-header-for="' + cat + '"]').addClass('active');
            $('#activeCategoryName').text(cat);
            renderDedicatedList();
        }

        function updateBadges() {
            ['CBS', 'ATM', 'POS', 'EPIN', 'VISANET'].forEach(function (cat) {
                var btn = $('[data-header-for="' + cat + '"]');
                var files = uploadedFilesStore[cat];
                var badge = btn.find('.source-badge');

                // Sum all inserted rows for this category
                var totalRows = 0;
                files.forEach(function (f) { totalRows += f.recordsInserted; });

                badge.text(totalRows + " rows");
                if (totalRows > 0) {
                    btn.addClass('has-data');
                } else {
                    btn.removeClass('has-data');
                }
            });
        }

        function renderDedicatedList() {
            var files = uploadedFilesStore[activeCategory];
            var $tbody = $('#dedicatedFileTableBody');
            $tbody.empty();

            var totalRowsCategory = 0;
            files.forEach(function (f) { totalRowsCategory += f.recordsInserted; });

            $('#categoryFileCount').text(files.length + " file(s) | " + totalRowsCategory + " total rows in DB");

            if (files.length === 0) {
                $tbody.append(
                    '<tr>' +
                        '<td colspan="4" class="no-data">' +
                            '<i class="fa fa-folder-open-o"></i>' +
                            'No files uploaded for <b>' + activeCategory + '</b> yet.<br>' +
                            '<span style="font-size:12px; color:#888;">Select <b>Upload &gt; ' + activeCategory + '</b> to upload files.</span>' +
                        '</td>' +
                    '</tr>'
                );
                return;
            }

            files.forEach(function (file) {
                var badgeClass = file.recordsInserted > 0 ? 'badge-success-count' : 'badge-zero-count';
                var rowHtml =
                    '<tr>' +
                        '<td style="width: 35%;">' +
                            '<div class="file-name-cell">' +
                                '<i class="fa fa-file-text-o"></i>' +
                                '<span>' + file.fileName + '</span>' +
                            '</div>' +
                        '</td>' +
                        '<td style="width: 25%; color: #475569;"><i class="fa fa-clock-o" style="margin-right:6px; color:#94a3b8;"></i>' + file.uploadDate + '</td>' +
                        '<td style="width: 20%;">' + file.fileSize + '</td>' +
                        '<td style="width: 20%;">' +
                            '<span class="' + badgeClass + '">' +
                                '<i class="fa fa-check-circle"></i> ' + file.recordsInserted + ' rows inserted' +
                            '</span>' +
                        '</td>' +
                    '</tr>';
                $tbody.append(rowHtml);
            });
        }

        function downloadCategoryExcel(type) {
            window.location.href = "SourceDataExportExcel?type=" + encodeURIComponent(type);
        }

        function extractData() {
            if (!confirm("Start 3-way VISA reconciliation (VISA + CBS + Switch)?")) {
                return;
            }

            $('#uploadStatusMsg').show().html('<i class="fa fa-spinner fa-spin"></i> Executing VISA Reconciliation process...');

            $.ajax({
                url: 'runVisaReconciliation',
                type: 'POST',
                data: { reconDate: '' },
                success: function(res) {
                    $('#uploadStatusMsg').hide();
                    alert(res.message);
                    if (confirm("Reconciliation complete. Download Failed Transaction Refund Report now?")) {
                        window.location.href = 'downloadFailedRefundReport';
                    }
                },
                error: function(xhr) {
                    $('#uploadStatusMsg').hide();
                    var err = (xhr.responseJSON && xhr.responseJSON.message) ? xhr.responseJSON.message : xhr.statusText;
                    alert("Reconciliation failed: " + err);
                }
            });
        }
    </script>
</head>

<body>
    <div th:insert="XBRLHeaderMenu :: header"></div>

    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv, .txt, .TXT" style="display: none;" />

    <div class="source-data-wrapper">
        <div class="source-data-card">
            <div class="source-data-header">
                <span><i class="fa fa-bar-chart"></i> Source Data</span>
            </div>

            <div class="source-data-table-wrapper">
                <table class="category-nav-table">
                    <thead>
                        <tr>
                            <th style="width:14%;">
                                <button type="button" class="source-header-clickable" data-header-for="CBS" onclick="switchCategory('CBS')">
                                    <span>CBS</span>
                                    <span class="source-badge">0 rows</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable active" data-header-for="ATM" onclick="switchCategory('ATM')">
                                    <span>ATM</span>
                                    <span class="source-badge">0 rows</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable" data-header-for="POS" onclick="switchCategory('POS')">
                                    <span>POS</span>
                                    <span class="source-badge">0 rows</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable" data-header-for="EPIN" onclick="switchCategory('EPIN')">
                                    <span>EPIN</span>
                                    <span class="source-badge">0 rows</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable" data-header-for="VISANET" onclick="switchCategory('VISANET')">
                                    <span>VISANET</span>
                                    <span class="source-badge">0 rows</span>
                                </button>
                            </th>

                            <!-- Upload Dropdown -->
                            <th class="dropdown-header-cell" style="width:13%;">
                                <div class="action-dropdown" id="uploadDropdown">
                                    <button type="button" id="uploadButton" class="upload-btn" aria-haspopup="true" aria-expanded="false">
                                        <i class="fa fa-upload"></i>Upload
                                        <span class="dropdown-arrow">&#9662;</span>
                                    </button>

                                    <div class="action-dropdown-menu" id="uploadMenu" role="menu">
                                        <a href="#" role="menuitem" data-type="CBS"><i class="fa fa-database"></i>CBS</a>
                                        <a href="#" role="menuitem" data-type="ATM"><i class="fa fa-credit-card"></i>ATM</a>
                                        <a href="#" role="menuitem" data-type="POS"><i class="fa fa-desktop"></i>POS</a>
                                        <a href="#" role="menuitem" data-type="EPIN"><i class="fa fa-key"></i>EPIN</a>
                                        <a href="#" role="menuitem" data-type="VISANET"><i class="fa fa-globe"></i>VISANET</a>
                                    </div>
                                </div>
                            </th>

                            <!-- Excel Export Dropdown -->
                            <th class="dropdown-header-cell" style="width:12%;">
                                <div class="action-dropdown" id="excelDropdown">
                                    <button type="button" id="excelButton" class="header-action-btn" aria-haspopup="true" aria-expanded="false">
                                        <i class="fa fa-file-excel-o"></i>EXCEL
                                        <span class="dropdown-arrow">&#9662;</span>
                                    </button>

                                    <div class="action-dropdown-menu" id="excelMenu" role="menu">
                                        <a href="#" role="menuitem" data-type="CBS"><i class="fa fa-database"></i>CBS</a>
                                        <a href="#" role="menuitem" data-type="ATM"><i class="fa fa-credit-card"></i>ATM</a>
                                        <a href="#" role="menuitem" data-type="POS"><i class="fa fa-desktop"></i>POS</a>
                                        <a href="#" role="menuitem" data-type="EPIN"><i class="fa fa-key"></i>EPIN</a>
                                        <a href="#" role="menuitem" data-type="VISANET"><i class="fa fa-globe"></i>VISANET</a>
                                    </div>
                                </div>
                            </th>

                            <th style="width:13%;">
                                <button type="button" class="header-action-btn" onclick="extractData()">
                                    <i class="fa fa-download"></i>EXTRACT
                                </button>
                            </th>
                        </tr>
                    </thead>
                </table>

                <div id="uploadStatusMsg"></div>

                <div class="file-list-container">
                    <div class="file-list-title-bar">
                        <span>Uploaded File(s) for: <strong id="activeCategoryName">ATM</strong></span>
                        <span id="categoryFileCount" style="color: var(--muted); font-size: 12px;">0 file(s) found</span>
                    </div>

                    <table class="dedicated-file-table">
                        <thead>
                            <tr>
                                <th>File Name</th>
                                <th>Upload Date & Time</th>
                                <th>File Size</th>
                                <th>Status / Rows Inserted</th>
                            </tr>
                        </thead>
                        <tbody id="dedicatedFileTableBody">
                            <tr>
                                <td colspan="4" class="no-data">
                                    <i class="fa fa-folder-open-o"></i>
                                    No files uploaded for <b>ATM</b> yet.<br>
                                    <span style="font-size:12px; color:#888;">Select <b>Upload &gt; ATM</b> to add a file.</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="source-data-footer">
                <a th:href="@{/Dashboard}" class="source-btn"><i class="fa fa-home"></i> Home</a>
                <a href="javascript:history.back();" class="source-btn"><i class="fa fa-chevron-left"></i> Back</a>
            </div>
        </div>
    </div>
</body>
</html>
