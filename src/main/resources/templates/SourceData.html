<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BRECON</title>

    <script src="/BRECON/js/jquery.min.js"></script>
    <script src="/BRECON/js/jquery-ui.min.js"></script>
    <!-- SheetJS library to parse Excel (.xlsx, .xls, .csv) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        :root {
            --brand: #386b7e;
            --brand-dark: #2c5667;
            --ink: #263746;
            --text: #111111;
            --muted: #6b7a88;
            --line: #d5dce2;
            --head-bg: #e9edf1;
            --head-hover: #dce3e9;
            --row-alt: #f7f9fb;
            --row-hover: #eaf2f5;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #f3f6f8;
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        /* ---------- Card ---------- */
        .source-data-wrapper {
            width: 86%;
            margin: 40px auto;
        }

        .source-data-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(20, 40, 55, 0.14);
            overflow: visible;
        }

        .source-data-header {
            height: 46px;
            background: linear-gradient(180deg, var(--brand) 0%, var(--brand-dark) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: .3px;
            border-radius: 14px 14px 0 0;
        }
        .source-data-header i { margin-right: 8px; }

        .source-data-table-wrapper {
            padding: 14px 14px 6px 14px;
            box-sizing: border-box;
            overflow: visible;
        }

        /* ---------- Top Category Navigation Bar ---------- */
        .category-nav-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            font-size: 13px;
            border: 1px solid var(--line);
            border-radius: 10px 10px 0 0;
            background: var(--head-bg);
        }

        .category-nav-table th {
            padding: 0;
            height: 42px;
            vertical-align: middle;
            white-space: nowrap;
            border-bottom: 2px solid var(--brand);
            border-right: 1px solid var(--line);
            position: relative;
        }
        .category-nav-table th:first-child { border-top-left-radius: 9px; }
        .category-nav-table th:last-child  { border-top-right-radius: 9px; border-right: none; }

        /* Clickable category tab button */
        .source-header-clickable {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 0 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            color: var(--ink);
            box-sizing: border-box;
            transition: all 0.15s ease;
        }
        .source-header-clickable:hover {
            background: var(--head-hover);
            color: var(--brand-dark);
        }
        .source-header-clickable.active {
            background: #ffffff;
            color: var(--brand);
            box-shadow: inset 0 -3px 0 var(--brand);
        }

        .source-header-clickable .source-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            background: #cbd5e1;
            color: #334155;
            font-weight: normal;
        }
        .source-header-clickable.has-data .source-badge {
            background: #28a745;
            color: #ffffff;
            font-weight: bold;
        }

        /* ---------- Upload dropdown ---------- */
        .upload-header-cell { overflow: visible !important; }

        .upload-dropdown {
            position: relative;
            width: 100%;
            height: 42px;
        }

        .upload-btn,
        .header-action-btn {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: none;
            background: transparent;
            color: var(--ink);
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            letter-spacing: .3px;
            transition: background .15s ease;
        }
        .upload-btn:hover,
        .header-action-btn:hover { background: var(--head-hover); }

        .upload-btn:focus-visible,
        .header-action-btn:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: -2px;
        }

        .upload-btn i, .header-action-btn i { margin-right: 6px; color: var(--brand); }

        .upload-arrow {
            float: right;
            font-size: 11px;
            margin-top: 2px;
            transition: transform .15s ease;
        }
        .upload-dropdown.open .upload-arrow { transform: rotate(180deg); }
        .upload-dropdown.open .upload-btn   { background: var(--head-hover); }

        .upload-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 100%;
            width: 170px;
            margin-top: 2px;
            background: #ffffff;
            border: 1px solid #c3ccd3;
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(20, 40, 55, 0.22);
            overflow: hidden;
            z-index: 9999;
            box-sizing: border-box;
        }
        .upload-dropdown.open .upload-menu { display: block; }

        .upload-menu a {
            display: block;
            height: 38px;
            line-height: 38px;
            padding: 0 14px;
            box-sizing: border-box;
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: normal;
            border-bottom: 1px solid #edf0f2;
        }
        .upload-menu a:last-child { border-bottom: none; }
        .upload-menu a:hover,
        .upload-menu a:focus {
            background: var(--head-bg);
            color: var(--brand-dark);
            outline: none;
        }
        .upload-menu a i { width: 18px; margin-right: 6px; color: var(--brand); }

        /* ---------- Dedicated File List Table ---------- */
        .file-list-container {
            border: 1px solid var(--line);
            border-top: none;
            border-radius: 0 0 10px 10px;
            background: #ffffff;
            overflow: hidden;
        }

        .file-list-title-bar {
            padding: 10px 14px;
            background: #f8fafc;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--ink);
        }
        .file-list-title-bar strong {
            color: var(--brand-dark);
            font-size: 14px;
        }

        .dedicated-file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .dedicated-file-table th {
            background: #f1f5f9;
            color: var(--ink);
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
            font-weight: 600;
        }
        .dedicated-file-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #edf2f7;
            color: var(--text);
            vertical-align: middle;
        }
        .dedicated-file-table tr:nth-child(even) td { background: var(--row-alt); }
        .dedicated-file-table tr:hover td { background: var(--row-hover); }
        .dedicated-file-table tr:last-child td { border-bottom: none; }

        .file-name-cell {
            font-weight: bold;
            color: var(--brand-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-name-cell i {
            color: #1d6f42; /* Excel green */
            font-size: 16px;
        }

        .btn-delete-file {
            background: none;
            border: none;
            color: #d9534f;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn-delete-file:hover {
            background: #fee2e2;
        }

        .no-data {
            text-align: center !important;
            color: var(--muted) !important;
            padding: 46px 10px !important;
            font-size: 14px;
        }
        .no-data i { display: block; font-size: 30px; margin-bottom: 10px; color: #b4c2cc; }

        /* ---------- Footer ---------- */
        .source-data-footer {
            border-top: 1px solid #e3e8ec;
            padding: 10px 0;
            text-align: center;
            background: #ffffff;
            border-radius: 0 0 14px 14px;
        }

        .source-btn {
            display: inline-block;
            padding: 6px 14px;
            margin: 0 3px;
            background: #ffffff;
            border: 1px solid #8a98a3;
            border-radius: 6px;
            color: var(--ink);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease;
        }
        .source-btn:hover {
            background: var(--head-bg);
            border-color: var(--brand);
            color: #000;
            text-decoration: none;
        }

        @media screen and (max-width: 1000px) {
            .source-data-wrapper { width: 95%; }
            .source-data-table-wrapper { overflow-x: auto; }
            .category-nav-table { min-width: 900px; font-size: 12px; }
        }
    </style>

    <script>
        var currentUploadType = "";
        var activeCategory = "ATM"; // Default selected view

        // Dedicated array of uploaded files for each category
        var uploadedFilesStore = {
            CBS: [],
            ATM: [],
            POS: [],
            EPIN: [],
            VISANET: []
        };

        $(function () {
            var $dd  = $('#uploadDropdown');
            var $btn = $('#uploadButton');

            function openMenu()  { $dd.addClass('open');    $btn.attr('aria-expanded', 'true'); }
            function closeMenu() { $dd.removeClass('open'); $btn.attr('aria-expanded', 'false'); }

            $btn.on('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                $dd.hasClass('open') ? closeMenu() : openMenu();
            });

            $(document).on('click', function (e) {
                if (!$(e.target).closest('#uploadDropdown').length) { closeMenu(); }
            });

            $(document).on('keydown', function (e) {
                if (e.key === 'Escape') {
                    closeMenu();
                    $btn.focus();
                }
            });

            // Upload selection
            $('#uploadMenu a').on('click', function (e) {
                e.preventDefault();
                currentUploadType = $(this).data('type');
                closeMenu();
                $('#excelFileInput').val('');
                $('#excelFileInput').click();
            });

            // Handle file upload
            $('#excelFileInput').on('change', function (e) {
                var file = e.target.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function (evt) {
                    var data = new Uint8Array(evt.target.result);
                    var workbook = XLSX.read(data, { type: 'array' });
                    var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    var rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    var rowCount = rawRows.length > 0 ? (rawRows.length - 1) : 0; // Exclude header row

                    var now = new Date();
                    var formattedDate = now.toLocaleDateString() + " " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    var fileRecord = {
                        id: Date.now(),
                        fileName: file.name,
                        uploadDate: formattedDate,
                        fileSize: (file.size / 1024).toFixed(2) + " KB",
                        rowCount: rowCount > 0 ? rowCount : rawRows.length
                    };

                    // Add to dedicated store
                    uploadedFilesStore[currentUploadType].push(fileRecord);

                    // Switch active tab to the uploaded category
                    switchCategory(currentUploadType);
                    updateBadges();
                };
                reader.readAsArrayBuffer(file);
            });

            // Initial view
            switchCategory('ATM');
        });

        // Switch category list when clicking header (CBS, ATM, POS, EPIN, VISANET)
        function switchCategory(cat) {
            activeCategory = cat;

            // Highlight active button
            $('.source-header-clickable').removeClass('active');
            $('[data-header-for="' + cat + '"]').addClass('active');

            $('#activeCategoryName').text(cat);
            renderDedicatedList();
        }

        // Update counts on badges
        function updateBadges() {
            ['CBS', 'ATM', 'POS', 'EPIN', 'VISANET'].forEach(function (cat) {
                var btn = $('[data-header-for="' + cat + '"]');
                var count = uploadedFilesStore[cat].length;
                var badge = btn.find('.source-badge');

                badge.text(count);
                if (count > 0) {
                    btn.addClass('has-data');
                } else {
                    btn.removeClass('has-data');
                }
            });
        }

        // Render dedicated list for the selected category
        function renderDedicatedList() {
            var files = uploadedFilesStore[activeCategory];
            var $tbody = $('#dedicatedFileTableBody');
            $tbody.empty();

            $('#categoryFileCount').text(files.length + " file(s) found");

            if (files.length === 0) {
                $tbody.append(
                    '<tr>' +
                        '<td colspan="5" class="no-data">' +
                            '<i class="fa fa-folder-open-o"></i>' +
                            'No files uploaded for <b>' + activeCategory + '</b> yet.<br>' +
                            '<span style="font-size:12px; color:#888;">Select <b>Upload &gt; ' + activeCategory + '</b> to add an Excel file.</span>' +
                        '</td>' +
                    '</tr>'
                );
                return;
            }

            files.forEach(function (file, index) {
                var rowHtml =
                    '<tr>' +
                        '<td style="width: 35%;">' +
                            '<div class="file-name-cell">' +
                                '<i class="fa fa-file-excel-o"></i>' +
                                '<span>' + file.fileName + '</span>' +
                            '</div>' +
                        '</td>' +
                        '<td style="width: 25%; color: #475569;"><i class="fa fa-clock-o" style="margin-right:5px; color:#94a3b8;"></i>' + file.uploadDate + '</td>' +
                        '<td style="width: 15%;">' + file.fileSize + '</td>' +
                        '<td style="width: 15%;"><span style="background:#e2e8f0; padding:2px 8px; border-radius:12px; font-size:12px;">' + file.rowCount + ' rows</span></td>' +
                        '<td style="width: 10%; text-align: center;">' +
                            '<button type="button" class="btn-delete-file" onclick="removeFile(' + file.id + ')" title="Remove File">' +
                                '<i class="fa fa-trash"></i>' +
                            '</button>' +
                        '</td>' +
                    '</tr>';
                $tbody.append(rowHtml);
            });
        }

        // Remove a file from the list
        function removeFile(fileId) {
            uploadedFilesStore[activeCategory] = uploadedFilesStore[activeCategory].filter(function (f) {
                return f.id !== fileId;
            });
            updateBadges();
            renderDedicatedList();
        }

        function exportExcel() {
            console.log("Excel clicked");
        }

        function extractData() {
            console.log("Extract clicked");
        }
    </script>
</head>

<body>

    <div th:insert="XBRLHeaderMenu :: header"></div>

    <!-- Hidden file input for Excel upload -->
    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;" />

    <div class="source-data-wrapper">
        <div class="source-data-card">

            <div class="source-data-header">
                <span><i class="fa fa-bar-chart"></i> Source Data</span>
            </div>

            <div class="source-data-table-wrapper">
                <!-- Top Navigation & Actions Bar -->
                <table class="category-nav-table">
                    <thead>
                        <tr>
                            <th style="width:14%;">
                                <button type="button" class="source-header-clickable" data-header-for="CBS" onclick="switchCategory('CBS')">
                                    <span>CBS</span>
                                    <span class="source-badge">0</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable active" data-header-for="ATM" onclick="switchCategory('ATM')">
                                    <span>ATM</span>
                                    <span class="source-badge">0</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable" data-header-for="POS" onclick="switchCategory('POS')">
                                    <span>POS</span>
                                    <span class="source-badge">0</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable" data-header-for="EPIN" onclick="switchCategory('EPIN')">
                                    <span>EPIN</span>
                                    <span class="source-badge">0</span>
                                </button>
                            </th>
                            <th style="width:12%;">
                                <button type="button" class="source-header-clickable" data-header-for="VISANET" onclick="switchCategory('VISANET')">
                                    <span>VISANET</span>
                                    <span class="source-badge">0</span>
                                </button>
                            </th>

                            <!-- Dropdown upload -->
                            <th class="upload-header-cell" style="width:13%;">
                                <div class="upload-dropdown" id="uploadDropdown">
                                    <button type="button" id="uploadButton" class="upload-btn" aria-haspopup="true" aria-expanded="false">
                                        <i class="fa fa-upload"></i>Upload
                                        <span class="upload-arrow">&#9662;</span>
                                    </button>

                                    <div class="upload-menu" id="uploadMenu" role="menu">
                                        <a href="#" role="menuitem" data-type="CBS"><i class="fa fa-database"></i>CBS</a>
                                        <a href="#" role="menuitem" data-type="ATM"><i class="fa fa-credit-card"></i>ATM</a>
                                        <a href="#" role="menuitem" data-type="POS"><i class="fa fa-desktop"></i>POS</a>
                                        <a href="#" role="menuitem" data-type="EPIN"><i class="fa fa-key"></i>EPIN</a>
                                        <a href="#" role="menuitem" data-type="VISANET"><i class="fa fa-globe"></i>VISANET</a>
                                    </div>
                                </div>
                            </th>

                            <th style="width:12%;">
                                <button type="button" class="header-action-btn" onclick="exportExcel()">
                                    <i class="fa fa-file-excel-o"></i>EXCEL
                                </button>
                            </th>

                            <th style="width:13%;">
                                <button type="button" class="header-action-btn" onclick="extractData()">
                                    <i class="fa fa-download"></i>EXTRACT
                                </button>
                            </th>
                        </tr>
                    </thead>
                </table>

                <!-- Dedicated File List View for Selected Category -->
                <div class="file-list-container">
                    <div class="file-list-title-bar">
                        <span>Showing Uploaded Files for: <strong id="activeCategoryName">ATM</strong></span>
                        <span id="categoryFileCount" style="color: var(--muted); font-size: 12px;">0 file(s) found</span>
                    </div>

                    <table class="dedicated-file-table">
                        <thead>
                            <tr>
                                <th>File Name</th>
                                <th>Upload Date & Time</th>
                                <th>File Size</th>
                                <th>Records</th>
                                <th style="text-align: center;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="dedicatedFileTableBody">
                            <tr>
                                <td colspan="5" class="no-data">
                                    <i class="fa fa-folder-open-o"></i>
                                    No files uploaded for <b>ATM</b> yet.<br>
                                    <span style="font-size:12px; color:#888;">Select <b>Upload &gt; ATM</b> to add an Excel file.</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <div class="source-data-footer">
                <a href="/BRECON/dashboard" class="source-btn"><i class="fa fa-home"></i> Home</a>
                <a href="javascript:history.back();" class="source-btn"><i class="fa fa-chevron-left"></i> Back</a>
            </div>

        </div>
    </div>

</body>
</html>
