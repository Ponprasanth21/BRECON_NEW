    const parts = dateStr.split('-'); // input = 'yyyy-MM-dd'
    if (parts.length === 3) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`; // output = 'dd-MM-yyyy'
    }

function checkDuplicateCombination(selectElement) {
	    const row = selectElement.closest("tr");
	    const fxd = row.querySelector('[name="fxd_crncy"]').value;
	    const vrb = row.querySelector('[name="var_crncy"]').value;

	    if (fxd && vrb) {
	        if (fxd === vrb) {
	        	  $.toast({
	                  heading: 'Warning',
	                  text: 'Fixed and Variable currency cannot be the same.',
	                  icon: 'warning',
	                  showHideTransition: 'plain',
	                  position: { left: 1600, top: 0 },
	                  loaderBg: '#ffc107',
	                  hideAfter: 4000
	              }); 
	            selectElement.value = "";
	            return;
	        }

	        const tableBody = document.getElementById("rateTableBody");
	        const rows = tableBody.querySelectorAll("tr");
	        let duplicateFound = false;

	        rows.forEach(r => {
	            if (r !== row) {
	                const existingFxd = r.querySelector('[name="fxd_crncy"]').value;
	                const existingVrb = r.querySelector('[name="var_crncy"]').value;

	                if (fxd === existingFxd && vrb === existingVrb) {
	                    duplicateFound = true;
	                }
	            }
	        });
	        if (duplicateFound) {
	        	  $.toast({
	                  heading: 'Warning',
	                  text: 'This currency combination already exists.',
	                  icon: 'warning',
	                  showHideTransition: 'plain',
	                  position: { left: 1600, top: 0 },
	                  loaderBg: '#ffc107',
	                  hideAfter: 4000
	              }); 
	        	  selectElement.value = "";
	              return;  
	        }
	    }
}
function submitAllRates() {
	document.getElementById('loadingModal').style.display = 'flex';
    const tableBody = document.getElementById("rateTableBody");
    const rows = tableBody.querySelectorAll("tr");
    const dataList = [];
    // ✅ Serial number = current row count + 1
    const srlNo = tableBody.querySelectorAll("tr").length + 1;
    rows.forEach(row => {
        const rate_code_desc = row.querySelector('[name="rate_code_desc"]')?.value;
        const rate_code_desc_desc = row.querySelector('[name="rate_code_desc"]')?.selectedOptions[0]?.text;
        const rate_date_raw = row.querySelector('[name="date"]')?.value;
        const eff_date_raw = row.querySelector('[name="eff_date"]')?.value;
        const fxd_crncy = row.querySelector('[name="fxd_crncy"]')?.value;
        const var_crncy = row.querySelector('[name="var_crncy"]')?.value;
        const rate = row.querySelector('[name="rate"]')?.value;
        const version = 1;
        if (rate_code_desc && rate_date_raw && eff_date_raw && fxd_crncy && var_crncy && rate) {
            dataList.push({
                rate_code_desc,
                rate_code_desc_desc,
                fxd_crncy,
                var_crncy,
                rate: parseFloat(rate),
                rate_date: new Date(rate_date_raw),
                eff_date: new Date(eff_date_raw),
                version: version
            });
        }
    });
    if (dataList.length === 0) {
    	document.getElementById('loadingModal').style.display = 'none';
       $.toast({
            heading: 'Warning',
            text: 'No valid data to submit.',
            icon: 'warning',
            showHideTransition: 'plain',
            position: { left: 1600, top: 0 },
            loaderBg: '#ffc107',
            hideAfter: 4000
        }); 
        return;
    }
    $.ajax({
        url: 'submitAllRates',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(dataList),
        success: function () {
        	document.getElementById('loadingModal').style.display = 'none';

                heading: 'Success',

                showHideTransition: 'plain',
                position: { left: 1600, top: 0 },
                loaderBg: '#28a745',
                hideAfter: 3000

                icon: 'error',
                showHideTransition: 'plain',
                position: { left: 1600, top: 0 },
                loaderBg: '#dc3545',
                hideAfter: 5000
            }); 
        }
    });
}

// ✅ Submit all rows (fetched + new)
function formatDateToYYYYMMDD(dateStr) {
    const parts = dateStr.split('-'); // expecting dd-MM-yyyy
    if (parts.length === 3) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`; // yyyy-MM-dd
    }
    return dateStr;
}
function parseFlexibleDate(dateStr) {
    if (!dateStr) return null;

    // If dateStr is in yyyy-MM-dd (new rows), return new Date directly
    if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        return new Date(dateStr);
    }

    // If dateStr is in dd-MM-yyyy (fetched rows), convert it
    if (/^\d{2}-\d{2}-\d{4}$/.test(dateStr)) {
        const [dd, mm, yyyy] = dateStr.split('-');
        return new Date(`${yyyy}-${mm}-${dd}`);
    }

    // Fallback
    return new Date(dateStr);
}
function submitAllVersions() {
	document.getElementById('loadingModal').style.display = 'flex';
    const tableBody = document.getElementById("rateTableBody");
    const rows = tableBody.querySelectorAll("tr");
    const versionList = [];
    // ✅ Serial number = current row count + 1
    const srlNo = tableBody.querySelectorAll("tr").length + 1;
    rows.forEach(row => {
        if (row.id === "noDataRow") return;
        const rateInput = row.querySelector('[name="rate"]');
        const originalRateInput = row.querySelector('[name="original_rate"]');
        const rate = rateInput?.value?.trim();
        const originalRate = originalRateInput?.value?.trim();
        const rate_code_desc_elem = row.querySelector('[name="rate_code_desc"]');
        const rate_code_desc = rate_code_desc_elem?.value?.trim() || '';
        const rate_code_desc_desc = rate_code_desc_elem?.tagName === 'SELECT'
            ? rate_code_desc_elem.selectedOptions[0]?.text.trim()
            : rate_code_desc_elem?.value?.trim();
        const rate_date_raw = row.querySelector('[name="rate_date"]')?.value || row.querySelector('[name="date"]')?.value || '';
        const eff_date_raw = row.querySelector('[name="eff_date"]')?.value || '';
        const fxd_crncy = row.querySelector('[name="fxd_crncy"]')?.value?.trim() || '';
        const var_crncy = row.querySelector('[name="var_crncy"]')?.value?.trim() || '';

        // ✅ Skip row if rate not modified
        if (rate === originalRate) return;
        if (rate_code_desc && rate_date_raw && eff_date_raw && fxd_crncy && var_crncy && rate) {
            const rate_date = parseFlexibleDate(rate_date_raw);
            const eff_date = parseFlexibleDate(eff_date_raw);
            versionList.push({
                rate_code_desc,
                rate_code_desc_desc,
                fxd_crncy,
                var_crncy,
                rate: parseFloat(rate),
                rate_date,
                eff_date
            });
        }
    });
    if (versionList.length === 0) {
    	document.getElementById('loadingModal').style.display = 'none';
       $.toast({
            heading: 'Info',
            text: 'No modified rates to submit.',
            icon: 'info',
            showHideTransition: 'plain',
            position: { left: 1600, top: 0 },
            loaderBg: '#17a2b8',
            hideAfter: 4000
        });
        return;
    }
    const submitBtn = document.getElementById("submitVersionsBtn");
    submitBtn.disabled = true;
    $.ajax({
        url: 'submitVersions',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(versionList),
        success: function () {
        document.getElementById('loadingModal').style.display = 'none';
          $.toast({
                heading: 'Success',
                text: 'Updated successfully!',
                icon: 'success',
                showHideTransition: 'plain',
                position: { left: 1600, top: 0 },
                loaderBg: '#28a745',
                hideAfter: 3000
            });
            document.getElementById("submitVersionsBtn").style.display = "none";
            List();
        },
        error: function () {
        	document.getElementById('loadingModal').style.display = 'none';
            $.toast({
                heading: 'Error',
                text: 'Error submitting versions.',
                icon: 'error',
                showHideTransition: 'plain',
                position: { left: 1600, top: 0 },
                loaderBg: '#dc3545',
                hideAfter: 5000
            }); 
        },
        complete: function () {
            submitBtn.disabled = false;
        }
    });
}

<script>
	function DateToDDMMYYYY(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return '';
    
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    
    return `${day}-${month}-${year}`;
}

function submitAllLists() {

    const listData = [];
    rows.forEach(row => {

        const rate_date_raw = row.querySelector('[name="rate_date"]')?.value || '';
        const eff_date_raw = row.querySelector('[name="eff_date"]')?.value || '';
        const fxd_crncy = row.querySelector('[name="fxd_crncy"]')?.value?.trim() || '';
        const var_crncy = row.querySelector('[name="var_crncy"]')?.value?.trim() || '';
        const rate = row.querySelector('[name="rate"]')?.value?.trim() || '';

        if (rate_code_desc && rate_date_raw && eff_date_raw && fxd_crncy && var_crncy && rate) {
            listData.push({
                rate_code_desc,
                rate_code_desc_desc,
                rate_date: formatToYYYYMMDD(rate_date_raw),
                eff_date: formatToYYYYMMDD(eff_date_raw),
                fxd_crncy,
                var_crncy,
                rate: parseFloat(rate)
            });
        }
    });
    if (listData.length === 0) {
    	document.getElementById('loadingModal').style.display = 'none';
       $.toast({
            heading: 'Warning',

            icon: 'warning',

            hideAfter: 4000
        });

    $.ajax({

        	document.getElementById('loadingModal').style.display = 'none';

                heading: 'Success',

            }) 
            List();
            document.getElementById("submitListsBtn").style.display = "none";
            document.getElementById("addListRowIcon").style.display = "none";
            document.getElementById("rateTableBody").innerHTML = `
                <tr id="noDataRow">
                    <td colspan="12" class="text-center text-muted">No data available</td>
                </tr>`;   
        },
        error: function () {
        	document.getElementById('loadingModal').style.display = 'none';
            $.toast({
                heading: 'Error',
                text: 'Error submitting list.',
                icon: 'error',
                showHideTransition: 'plain',
                position: { left: 1600, top: 0 },
                loaderBg: '#dc3545',
                hideAfter: 5000
            });
        }
    });
}
function formatToYYYYMMDD(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length === 3) {
        // Already in yyyy-MM-dd?
        if (parts[0].length === 4) return dateStr;
        return `${parts[2]}-${parts[1]}-${parts[0]}`; // Convert dd-MM-yyyy ➝ yyyy-MM-dd
    }
    return dateStr;
}

<script>
	function handleSectionClick(activeSection) {
    const listTable = document.getElementById("initialRateList");
    if (listTable) listTable.style.display = "none";

    const sections = {
        rate: ['addRateIcon'],
        version: ['fetchIcon', 'addRowIcon'],
        list: ['fetchListIcon', 'addListRowIcon']
    };

    const allIcons = ['addRateIcon', 'fetchIcon', 'addRowIcon', 'fetchListIcon', 'addListRowIcon'];
    allIcons.forEach(iconId => {
        const icon = document.getElementById(iconId);
        if (icon) {
            icon.style.pointerEvents = "none";
            icon.style.opacity = "0.5";
        }
    });

    if (sections[activeSection]) {
        sections[activeSection].forEach(iconId => {
            const icon = document.getElementById(iconId);
            if (icon) {
                icon.style.pointerEvents = "auto";
                icon.style.opacity = "1";
            }
        });
    }
}
function verifySubmit(a) {
	document.getElementById('loadingModal').style.display = 'flex';
    event.preventDefault();
    const unique_id = a.getAttribute("data-unique_id");
    const entryuser = a.getAttribute("data-entry_user");
    const loginuser = a.getAttribute("data-login_user");
    // ❌ Prevent same user from verifying (Maker-Checker Rule)
    if (loginuser === entryuser) {
       document.getElementById('loadingModal').style.display = 'none';
       $.toast({
            heading: 'Error',
            text: 'Same user cannot verify this entry.',
            icon: 'error',
            position: { left: 1600, top: 0 },
            loaderBg: '#ffc107',
            hideAfter: 4000
        }); 
        return; // ❗ Stop execution
    }
    // ✅ Proceed with AJAX verification
    $.ajax({
        url: './verifyRate',
        type: 'POST',
        data: { unique_id: unique_id },
        success: function (responseText) {
        	document.getElementById('loadingModal').style.display = 'none';
            const isFailure = responseText.includes("Same user") || responseText.includes("not found");
            $.toast({
                heading: isFailure ? 'Error' : 'Success',
                text: responseText,
                icon: isFailure ? 'error' : 'success',
                position: { left: 1600, top: 0 },
                loaderBg: isFailure ? '#dc3545' : '#28a745',
                hideAfter: 4000
            }); 
            if (!isFailure) {
                filterRateListByDate(); // 🔄 Refresh only if verified
            }
        },
        error: function () {
        	document.getElementById('loadingModal').style.display = 'none';
            $.toast({
                heading: 'Error',
                text: 'Verification request failed.',
                icon: 'error',
                position: { left: 1600, top: 0 },
                loaderBg: '#dc3545',
                hideAfter: 4000
            }); 
        }
    });
}
/*  format for decimal*/
function formatTolerance(input) {
    let value = parseFloat(input.value.replace(/,/g, ''));
    if (!isNaN(value)) {
        input.value = value.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    }
}
function allowNumbersOnly(input) {
    // Remove anything except digits and a single period
    input.value = input.value
        .replace(/[^\d.]/g, '')        // Remove non-digits/non-period
        .replace(/(\..*)\./g, '$1');   // Allow only one period
}

						<button type="button" class="btn btn-outline-dark me-3" onclick="home()"
							style="border-radius: 6px;"><i class="fas fa-home me-1"></i> Home</button>
						<!-- Submit All Button (hidden by default) -->
						<button type="button" id="submitAllBtn" class="btn btn-outline-dark me-3"
							style="display:none;border-radius: 6px;" onclick="submitAllRates()">
							<i class="fas fa-upload me-1"></i> Submit</button>
						<button type="button" id="submitVersionsBtn" class="btn btn-outline-dark me-3"
							onclick="submitAllVersions()" style="display:none; border-radius: 6px;">
							<i class="fas fa-upload me-1"></i> Submit</button>
						<!-- List Submit Button -->
						<button type="button" id="submitListBtn" class="btn btn-outline-dark me-3" style="display:none; border-radius: 6px;"
							onclick="submitAllLists()">
							<i class="fas fa-upload me-1"></i> Submit</button>
						<button type="button" class="btn btn-outline-dark me-3" onclick="back()"
							style="border-radius: 6px;"><i class="fas fa-angle-left me-1"></i> Back</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
