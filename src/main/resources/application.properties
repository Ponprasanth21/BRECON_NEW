# Increase maximum active pool connections (default is 10)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5

# Increase connection acquisition timeout to 60 seconds (default is 30s)
spring.datasource.hikari.connection-timeout=60000

# Keep alive and idle timeouts
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Connection test query and validation settings for Oracle (Prevents sleep/network drop errors)
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000


# Enable Oracle JDBC Statement Caching for faster batch execution
spring.datasource.hikari.data-source-properties.oracle.jdbc.implicitStatementCacheSize=50
spring.datasource.hikari.data-source-properties.netTimeout=60000

# Optimize batch pre-compiled statements
spring.datasource.hikari.data-source-properties.sendStringParametersAsUnicode=false

# =========================================================================
# Oracle SQL*Loader (sqlldr) Configuration for Ultra High-Speed Bulk Uploads
# =========================================================================
sqlldr.enabled=${SQLLDR_ENABLED:true}
# Auto-detected dynamically from PATH, ORACLE_HOME, or standard install dirs (C:\app\<username>\..., C:\oracle, etc.)
# Can be overridden per machine via environment variables: SQLLDR_PATH and ORACLE_HOME
sqlldr.path=${SQLLDR_PATH:}
sqlldr.oracleHome=${ORACLE_HOME:}
sqlldr.direct=false
sqlldr.bindsize=20971520
sqlldr.readsize=20971520
sqlldr.rows=50000
sqlldr.errors=100000